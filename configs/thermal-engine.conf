# SENSOR : ALIAS
#Conf file: /vendor/etc/thermal-engine.conf

[CPU-CLUSTER0-MONITOR]
algo_type           monitor
sampling            2000
sensor              cpuss-0
thresholds          75000        80000        85000
thresholds_clr      74000        79000        84000
actions             cpu-cluster0 cpu-cluster0 cpu-cluster0
action_info         1900800      1843200      1708800

[CPU-CLUSTER1-MONITOR]
algo_type           monitor
sampling            2000
sensor              cpuss-1
thresholds          70000        75000        80000        85000
thresholds_clr      69000        74000        79000        84000
actions             cpu-cluster1 cpu-cluster1 cpu-cluster1 cpu-cluster1
action_info         2188800      1920000      1708800      1497600

[CPU-CLUSTER2-MONITOR]
algo_type           monitor
sampling            2000
sensor              cpuss-1
thresholds          70000        75000        80000        85000
thresholds_clr      69000        74000        79000        84000
actions             cpu-cluster2 cpu-cluster2 cpu-cluster2 cpu-cluster2
action_info         2304000      1900800      1651200      1324800

[GPU-VIRTUAL-TEMP]
algo_type           virtual
trip_sensor         gpuss-0
sensors             gpuss-0 gpuss-1 gpuss-2 gpuss-3
set_point           56000
set_point_clr       55000
sampling            2000
weights
math                2

[GPU-MONITOR]
algo_type           monitor
sampling            2000
sensor              GPU-VIRTUAL-TEMP
thresholds          63000      65000     71000     75000     80000     85000
thresholds_clr      61000      64000     69000     74000     79000     84000
actions             gpu        gpu       gpu       gpu       gpu       gpu
action_info         1000000000 950000000 900000000 835000000 736000000 684000000

[MODEM-VDD]
#algo_type monitor
sampling            10
sensor              mdmss-0
thresholds          5000
thresholds_clr      10000
actions             modem_vdd
action_info         1
descending

# Enhanced virtual sensor with more thermal sensors
[VIRTUAL-SENSOR-ENHANCED]
algo_type           virtual
sensors             cpu_therm charger_therm0 wifi_therm pa_therm0 pa_therm1 quiet_therm
trip_sensor         cpu_therm charger_therm0 wifi_therm pa_therm0 pa_therm1 quiet_therm
weights             -26 147 330 36 119 -2
sampling            2000
math                2

# Battery SOC-based CPU throttling
[MONITOR-BCL]
algo_type monitor
sensor battery_capacity
actions cpufreq-cpu0+cpufreq-cpu3+cpu-hotplug7+cpu-hotplug4+cpu-hotplug3
polling 2000
thresholds 90 95
thresholds_clr 88 93
action_info 787200+1286400+1+1+1 1843200+1286400+1+1+0
reverse 1

# Enhanced CPU hotplug control
[MONITOR-CCC-ENHANCED]
algo_type           monitor
sensor              VIRTUAL-SENSOR-ENHANCED
actions             cpu-hotplug3+cpu-hotplug4+cpu-hotplug7
sampling            2000
thresholds          50000
thresholds_clr      48000
action_info         1+1+1

# Flash thermal protection
[MONITOR-FLASH]
algo_type           monitor
sensor              flash_therm
actions             temp_state
sampling            2000
thresholds          60000 65000
thresholds_clr      57000 62000
action_info         110100003 110100004

# Backlight thermal throttling
[MONITOR-BACKLIGHT]
algo_type           monitor
sensor              VIRTUAL-SENSOR-ENHANCED
actions             panel0-backlight
sampling            2000
thresholds          51000
thresholds_clr      49000
action_info         160

# NPU thermal management
[MONITOR-NPU-ENHANCED]
algo_type           monitor
sensor              VIRTUAL-SENSOR-ENHANCED
actions             cdsp
sampling            1000
thresholds          25000 35000 37000 40000 45000 48000
thresholds_clr      23000 33000 35000 38000 43000 46000
action_info         1 2 3 4 5 7

# WiFi thermal limiting
[MONITOR-WIFI-LIMIT]
algo_type           monitor
sensor              VIRTUAL-SENSOR-ENHANCED
actions             wlan
sampling            2000
thresholds          42000 44000 45000 46000 47000
thresholds_clr      40000 42000 43000 44000 45000
action_info         1000010000 1000020000 1000020800 1000030800 1000030808

# Modem level control
[MONITOR-MODEM-LEVEL]
algo_type           monitor
sensor              VIRTUAL-SENSOR-ENHANCED
actions             modem_vdd
sampling            10000
thresholds          41000 43000 45000
thresholds_clr      39000 41000 42500
action_info         7 8 9

# Modem 5G to 4G switching
[MONITOR-MODEM-5GTO4G]
algo_type           monitor
sensor              VIRTUAL-SENSOR-ENHANCED
actions             modem_vdd
sampling            20000
thresholds          47000
thresholds_clr      43000
